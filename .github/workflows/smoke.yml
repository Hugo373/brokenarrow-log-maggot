name: smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run end-to-end smoke test
        run: python smoke_test.py
